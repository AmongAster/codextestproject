<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Battle Arena</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Case Battle Arena</h1>
      <p>CaseBattle-inspired demo with API, scrolling battles, admin item management, and payments.</p>
    </header>

    <main>
      <section class="panel">
        <h2>Cases</h2>
        <div id="caseGrid" class="case-grid"></div>
      </section>

      <section class="panel">
        <h2>Battle Roller</h2>
        <p id="selectedCaseLabel">Select a case to spin.</p>
        <button id="spinBtn" disabled>Open Case</button>
        <div class="roller-wrap">
          <div class="pointer"></div>
          <div id="roller" class="roller"></div>
        </div>
        <p id="winner"></p>
      </section>

      <section class="panel">
        <h2>Top-up / Payment Integration</h2>
        <form id="paymentForm">
          <label>Amount (USD)
            <input type="number" id="paymentAmount" min="1" step="0.01" value="20" required />
          </label>
          <button type="submit">Create Payment Intent</button>
        </form>
        <pre id="paymentResult"></pre>
      </section>

      <section class="panel">
        <h2>Admin Panel</h2>
        <p>Use your admin token to add skins/items to any case.</p>
        <form id="adminForm" class="admin-form">
          <label>Admin Token
            <input id="adminToken" placeholder="change-me-admin-token" required />
          </label>
          <label>Case
            <select id="adminCase"></select>
          </label>
          <label>Item Name
            <input id="itemName" required />
          </label>
          <label>Rarity
            <select id="itemRarity">
              <option value="common">common</option>
              <option value="uncommon">uncommon</option>
              <option value="rare">rare</option>
              <option value="epic">epic</option>
              <option value="legendary">legendary</option>
            </select>
          </label>
          <label>Value ($)
            <input id="itemValue" type="number" min="0.01" step="0.01" required />
          </label>
          <label>Drop Weight
            <input id="itemWeight" type="number" min="1" step="1" value="1" />
          </label>
          <label>Image URL
            <input id="itemImage" placeholder="https://..." />
          </label>
          <button type="submit">Add Item</button>
        </form>
        <p id="adminStatus"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
