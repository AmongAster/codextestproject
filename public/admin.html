<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerPro Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-bg">
    <header class="admin-header">
      <div>
        <h1>LedgerPro Admin Panel</h1>
        <p>Финансы, документы, заказы и изменение статусов</p>
      </div>
      <a href="/">← В магазин</a>
    </header>

    <main class="admin-layout">
      <section class="auth-card" id="admin-auth-card">
        <h2>Вход администратора</h2>
        <form id="admin-login-form">
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Пароль" required />
          <button type="submit">Войти</button>
          <small>По умолчанию: admin@ledgerpro.shop / Admin123!</small>
        </form>
      </section>

      <section class="hidden" id="admin-app">
        <div class="kpi-grid" id="admin-kpis"></div>

        <div class="admin-grid">
          <form id="product-form" class="card">
            <h3>Добавить товар</h3>
            <input name="title" placeholder="Название" required />
            <input name="category" placeholder="Категория" required />
            <input name="price" type="number" step="0.01" placeholder="Цена" required />
            <input name="stock" type="number" step="1" placeholder="Остаток" required />
            <input name="imageUrl" placeholder="URL изображения" />
            <textarea name="description" placeholder="Описание"></textarea>
            <button type="submit">Создать товар</button>
          </form>

          <form id="invoice-form" class="card">
            <h3>Документ Invoice</h3>
            <input name="userId" placeholder="ID пользователя" required />
            <input name="clientName" placeholder="Клиент" required />
            <input name="amount" type="number" step="0.01" placeholder="Сумма" required />
            <select name="status">
              <option value="pending">pending</option>
              <option value="paid">paid</option>
            </select>
            <button type="submit">Создать</button>
          </form>

          <form id="expense-form" class="card">
            <h3>Расход</h3>
            <input name="userId" placeholder="ID пользователя" required />
            <input name="category" placeholder="Категория" required />
            <input name="amount" type="number" step="0.01" placeholder="Сумма" required />
            <button type="submit">Добавить</button>
          </form>
        </div>

        <div class="admin-lists">
          <section>
            <h3>Заказы (можно менять статус)</h3>
            <ul id="admin-orders" class="list"></ul>
          </section>
          <section>
            <h3>Товары</h3>
            <ul id="admin-products" class="list"></ul>
          </section>
          <section>
            <h3>Invoices</h3>
            <ul id="admin-invoices" class="list"></ul>
          </section>
          <section>
            <h3>Expenses</h3>
            <ul id="admin-expenses" class="list"></ul>
          </section>
        </div>
      </section>

      <p id="admin-message" class="message"></p>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
